<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casas del Parque 7 — Reclamos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="4.6" r="1.5" fill="currentColor" stroke="none"></circle>
            <path d="M2.8 11.6L12 3.5l9.2 8.1"></path>
            <path d="M5.2 9.6v10.9h13.6V9.6"></path>
            <path d="M9.7 20.5v-6h4.6v6"></path>
          </svg>
        </div>
        <h1>Casas del Parque 7</h1>
        <p class="tagline">Reclamos de la comunidad sobre el servicio de guardias</p>
      </div>

      <div id="msg" class="msg"></div>

      <div class="tabs" id="auth-tabs">
        <button class="tab active" data-view="login">Iniciar sesión</button>
        <button class="tab" data-view="register">Registrarse</button>
      </div>

      <div id="view-login" class="view">
        <form id="login-form" autocomplete="off">
          <label>Correo
            <input type="email" id="login-email" required>
          </label>
          <label>Contraseña
            <input type="password" id="login-pass" required>
          </label>
          <button class="btn primary" id="login-btn" type="submit">Entrar</button>
        </form>
      </div>

      <div id="view-register" class="view" hidden>
        <form id="register-form" autocomplete="off">
          <label>Nombre completo
            <input type="text" id="reg-name" required maxlength="120">
          </label>
          <label>Correo
            <input type="email" id="reg-email" required>
          </label>
          <label>Contraseña
            <input type="password" id="reg-pass" required minlength="6">
          </label>
          <p class="hint">Máximo 2 vecinos por casa</p>
          <label>Número de casa
            <select id="reg-casa" required></select>
          </label>
          <button class="btn primary" id="reg-btn" type="submit">Crear cuenta</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="site">Hecho con cariño por la comunidad · Casas del Parque 7</footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
